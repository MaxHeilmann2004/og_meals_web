name: Playwright report comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: read

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the Playwright report comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const pullRequest = run.pull_requests?.[0]
            if (!pullRequest) return

            const { owner, repo } = context.repo
            const { data: currentPullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequest.number,
            })

            if (currentPullRequest.head.sha !== pullRequest.head.sha) return

            const marker = '<!-- playwright-report -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            })
            const existingComment = comments.find(comment =>
              comment.body?.includes(marker) && comment.user?.type === 'Bot',
            )

            if (run.conclusion === 'success') {
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                })
              }
              return
            }

            if (run.conclusion !== 'failure') return

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
            })
            const report = artifacts.artifacts.find(artifact =>
              artifact.name === `playwright-report-${run.id}` && !artifact.expired,
            )
            if (!report) return

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}`
            const reportUrl = `${runUrl}/artifacts/${report.id}`
            const body = [
              marker,
              '## Playwright browser tests failed',
              '',
              `Download the [Playwright report artifact](${reportUrl}) and open \`playwright-report/index.html\` to compare expected, actual, and diff images, or [open the workflow run](${runUrl}).`,
              '',
              'The report artifact is retained for 7 days.',
            ].join('\n')

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              })
            }
